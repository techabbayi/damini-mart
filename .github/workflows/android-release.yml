name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      NODE_ENV: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Node dependencies
      working-directory: ./mobile
      run: npm install

    - name: Patch Expo Modules Gradle Plugin
      working-directory: ./mobile
      run: |
        chmod +x fix-expo-gradle.sh
        ./fix-expo-gradle.sh

    - name: Make gradlew executable
      working-directory: ./mobile/android
      run: chmod +x gradlew

    - name: Clean Gradle
      working-directory: ./mobile/android
      run: ./gradlew clean --no-daemon

    - name: Build Release APK
      working-directory: ./mobile/android
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Damini Mart ${{ steps.version.outputs.VERSION }}
        body: |
          ## Damini Mart Mobile App Release
          
          ### Download & Install
          Download the APK file below and install on your Android device.
          
          ### Changes in this version
          - Bug fixes and improvements
          
          **Build Date:** ${{ github.event.repository.updated_at }}
          **Commit:** ${{ github.sha }}
        files: |
          mobile/android/app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: damini-mart-${{ steps.version.outputs.VERSION }}
        path: mobile/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90
