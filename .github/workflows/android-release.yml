name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  release:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: production
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386
        packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;26.1.10909125 cmake;3.22.1'

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libvips-dev

    - name: Install Node dependencies
      working-directory: ./mobile
      run: |
        npm install
        npm install --save-dev sharp@^0.34.5 sharp-cli@^5.2.0

    - name: Make gradlew executable
      working-directory: ./mobile/android
      run: chmod +x gradlew

    - name: Accept Android SDK licenses
      run: |
        yes | $ANDROID_SDK_ROOT/cmdline-tools/9.0/bin/sdkmanager --licenses 2>&1 || echo "License acceptance completed"

    - name: Build Release APK
      working-directory: ./mobile/android
      run: ./gradlew assembleRelease --no-daemon --stacktrace --info

    - name: Get version
      id: version
      run: |
        if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        fi

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.VERSION }}
        name: Damini Mart ${{ steps.version.outputs.VERSION }}
        body: |
          ## Damini Mart Mobile App Release
          
          ### Download & Install
          Download the APK file below and install on your Android device.
          
          ### Changes in this version
          - Bug fixes and improvements
          
          **Build Date:** ${{ github.event.repository.updated_at }}
          **Commit:** ${{ github.sha }}
        files: |
          mobile/android/app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload to Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: damini-mart-${{ steps.version.outputs.VERSION }}
        path: mobile/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 90
