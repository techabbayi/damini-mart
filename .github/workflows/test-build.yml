name: Test Build (Quick Check)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Test Dependencies Install
      working-directory: ./mobile
      run: |
        echo "📦 Installing dependencies..."
        npm ci
        npm install --save-dev sharp sharp-cli
        echo "✅ Dependencies installed"
        
    - name: Test Expo Prebuild
      working-directory: ./mobile
      run: |
        echo "🔨 Running Expo prebuild..."
        npx expo prebuild --platform android --clean
        echo "✅ Prebuild completed"
        
    - name: Check Android Files
      run: |
        echo "📁 Checking generated files..."
        ls -la mobile/android/
        if [ -f "mobile/android/gradlew" ]; then
          echo "✅ gradlew found"
          file mobile/android/gradlew
        else
          echo "❌ gradlew NOT found"
          exit 1
        fi
        
    - name: Summary
      run: |
        echo "🎉 Test completed successfully!"
        echo "✅ Dependencies install: OK"
        echo "✅ Expo prebuild: OK"
        echo "✅ Android files: OK"
