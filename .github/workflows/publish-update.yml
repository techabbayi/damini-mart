name: Publish Update (OTA)

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'mobile/**/*.js'
      - 'mobile/**/*.jsx'
      - 'mobile/**/*.json'
      - 'mobile/assets/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Expo
      uses: expo/expo-github-action@v8
      with:
        expo-version: latest
        eas-version: latest
        token: ${{ secrets.EXPO_TOKEN }}

    - name: Install dependencies
      working-directory: ./mobile
      run: npm ci

    - name: Publish Update
      working-directory: ./mobile
      run: |
        echo "📦 Publishing update..."
        eas update --auto --non-interactive
        echo "✅ Update published! Users will receive it on next app restart."

    - name: Update Summary
      run: |
        echo "🚀 **Update Published Successfully!**" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Users will receive update automatically" >> $GITHUB_STEP_SUMMARY
        echo "⏱️ Update available on next app restart" >> $GITHUB_STEP_SUMMARY
        echo "📱 No new APK installation needed!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Changed Files:**" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        git diff --name-only HEAD~1 HEAD mobile/ >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
