name: Android APK Build

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'URL to APK file (optional - if not provided, will build)'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      NODE_ENV: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Node dependencies
      working-directory: ./mobile
      run: npm install

    - name: Patch Expo Modules Gradle Plugin
      working-directory: ./mobile
      run: |
        chmod +x fix-expo-gradle.sh
        ./fix-expo-gradle.sh

    - name: Make gradlew executable
      working-directory: ./mobile/android
      run: chmod +x gradlew

    - name: Clean Gradle
      working-directory: ./mobile/android
      run: ./gradlew clean --no-daemon

    - name: Build APK
      working-directory: ./mobile/android
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: damini-mart-apk-${{ github.run_number }}
        path: mobile/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        if-no-files-found: error

    - name: Get APK info
      run: |
        APK_PATH="mobile/android/app/build/outputs/apk/release/app-release.apk"
        if [ -f "$APK_PATH" ]; then
          echo "✅ APK Build Successful!"
          echo "📦 APK Size: $(du -h $APK_PATH | cut -f1)"
          echo "📍 Location: $APK_PATH"
          echo "🔢 Build Number: ${{ github.run_number }}"
          echo "📅 Build Date: $(date)"
        else
          echo "❌ APK not found!"
          exit 1
        fi
