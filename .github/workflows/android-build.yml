name: Android APK Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    env:
      NODE_ENV: production
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        cmdline-tools-version: 9477386
        packages: |
          platform-tools
          platforms;android-34
          build-tools;34.0.0
          ndk;26.1.10909125
          cmake;3.22.1

    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libvips-dev

    - name: Install Node dependencies
      working-directory: ./mobile
      run: |
        npm ci
        npm install --save-dev sharp@^0.34.5 sharp-cli@^5.2.0

    - name: Run Expo prebuild
      working-directory: ./mobile
      run: |
        npx expo prebuild --platform android --clean

    - name: Make gradlew executable
      working-directory: ./mobile/android
      run: chmod +x gradlew

    - name: Accept Android SDK licenses
      run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Build APK
      working-directory: ./mobile/android
      run: ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: damini-mart-apk-${{ github.run_number }}
        path: mobile/android/app/build/outputs/apk/release/app-release.apk
        retention-days: 30
        if-no-files-found: error

    - name: Get APK info
      run: |
        APK_PATH="mobile/android/app/build/outputs/apk/release/app-release.apk"
        if [ -f "$APK_PATH" ]; then
          echo "✅ APK Build Successful!"
          echo "📦 APK Size: $(du -h $APK_PATH | cut -f1)"
          echo "📍 Location: $APK_PATH"
          echo "🔢 Build Number: ${{ github.run_number }}"
          echo "📅 Build Date: $(date)"
        else
          echo "❌ APK not found!"
          exit 1
        fi
